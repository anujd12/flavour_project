[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-flavour-pvm"
version = "1.0.0"
description = "A custom-keyword Python dialect with a stack-based bytecode VM"
requires-python = ">=3.8"

[project.scripts]
flavour = "flavour:main"

[tool.setuptools]
py-modules = ["flavour", "dialects"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pvm*"]
